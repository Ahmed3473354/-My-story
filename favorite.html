<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المفضلة ❤️</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fa;
}

h1{
    text-align:center;
    color:#1d4de8;
    margin:30px 0;
    font-size:40px;
}

#favorites{
    width:90%;
    max-width:1400px;
    margin:40px auto;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:30px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
    transition:.3s;
    text-align:center;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 12px 30px rgba(0,0,0,.2);
}

.card img{
    width:100%;
    height:270px;
    object-fit:cover;
}

.card button{
    width:90%;
    margin:15px auto;
    display:block;

    padding:12px;

    background:#1d4de8;
    color:white;

    border:none;
    border-radius:10px;

    font-size:17px;
    cursor:pointer;

    transition:.3s;
}

.card button:hover{
    background:#1740c7;
}

.remove{
    background:#e53935 !important;
}

.remove:hover{
    background:#c62828 !important;
}

@media(max-width:900px){
    #favorites{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    #favorites{
        grid-template-columns:1fr;
    }

    h1{
        font-size:30px;
    }
}

</style>

</head>

<body>

<h1>❤️ القصص المفضلة</h1>

<div id="favorites"></div>

<script>



let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

let container = document.getElementById("favorites");

favorites.forEach(function(item){

    container.innerHTML += `
        <div class="card">
            <img src="${item.image}">
            <button onclick="window.open('${item.link}')">
                ${item.title}
            </button>
        </div>
    `;

});
</script>

</body>
</html>
